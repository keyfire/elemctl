<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Cascadia Mono', Menlo, monospace; }
    .zone-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #7f8aa3; }
    .box-title { font-size: 14.5px; font-weight: 600; fill: #eef1f8; }
    .box-sub { font-size: 11.5px; fill: #7f8aa3; }
    .box-body { font-size: 12px; fill: #aab3c7; }
    .code { font-size: 11px; fill: #c9d4ea; }
    .code-dim { font-size: 11px; fill: #8b95ab; }
    .edge-label { font-size: 12px; font-weight: 600; fill: #c6cddd; }
    .edge-sub { font-size: 11px; font-style: italic; fill: #8b95ab; }
    .box { fill: #232a38; stroke: #3b445c; }
    .edge { stroke: #6d7891; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6d7891"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="999" height="619" rx="14" fill="#14171e" stroke="#262c38"/>

  <!-- zones -->
  <rect x="20" y="36" width="596" height="564" rx="10" fill="#181c26" stroke="#2c3345" stroke-dasharray="5 4"/>
  <rect x="648" y="36" width="332" height="564" rx="10" fill="#181c26" stroke="#2c3345" stroke-dasharray="5 4"/>
  <text x="36" y="64" class="zone-label">МАШИНА РАЗРАБОТЧИКА</text>
  <text x="664" y="64" class="zone-label">ОБЛАКО 1С:ЭЛЕМЕНТ</text>

  <!-- edges -->
  <line x1="284" y1="132" x2="372" y2="132" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="328" y="120" text-anchor="middle" class="edge-label">DAP (stdio)</text>
  <text x="328" y="152" text-anchor="middle" class="edge-sub">запускает</text>

  <line x1="164" y1="274" x2="164" y2="338" class="edge" marker-end="url(#ah)"/>
  <text x="176" y="312" class="edge-sub">зовёт</text>

  <line x1="284" y1="392" x2="668" y2="392" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="478" y="412" text-anchor="middle" class="code">debug-address, debug-token</text>

  <path d="M592,132 H802 V204" class="edge" marker-end="url(#ah)"/>
  <text x="700" y="120" text-anchor="middle" class="edge-label">WebSocket</text>
  <text x="700" y="150" text-anchor="middle" class="code">debug-address, debug-token</text>

  <path d="M284,240 H320 V508" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="330" y="470" class="edge-sub">открывает при старте</text>

  <path d="M592,548 H956 V238 H936" class="edge" marker-end="url(#ah)"/>
  <text x="770" y="536" text-anchor="middle" class="code">тот же sessionId</text>

  <!-- VS Code -->
  <rect x="44" y="84" width="240" height="190" rx="8" class="box"/>
  <rect x="44" y="92" width="3" height="174" rx="1.5" fill="#3794ff"/>
  <text x="60" y="112" class="box-title">VS Code</text>
  <text x="60" y="130" class="box-sub">(это расширение)</text>
  <text x="60" y="156" class="box-body">редактор, точки останова,</text>
  <text x="60" y="174" class="box-body">Variables / Watch</text>
  <rect x="58" y="188" width="212" height="70" rx="6" fill="#1a1f2a" stroke="#2d3444"/>
  <text x="68" y="208" class="mono code">xbslDebug.adapterPath</text>
  <text x="68" y="225" class="mono code">xbslDebug.javaPath</text>
  <text x="68" y="242" class="mono code">xbslDebug.elemctlPath</text>

  <!-- Java-адаптер отладки -->
  <rect x="372" y="84" width="220" height="96" rx="8" class="box"/>
  <rect x="372" y="92" width="3" height="80" rx="1.5" fill="#f0883e"/>
  <text x="388" y="112" class="box-title">Java-адаптер отладки</text>
  <text x="388" y="136" class="box-body">из дистрибутива</text>
  <text x="388" y="153" class="box-body">платформы</text>
  <text x="482" y="200" text-anchor="middle" class="mono code-dim">java -cp &lt;adapterPath&gt;/repo/*</text>

  <!-- elemctl -->
  <rect x="44" y="342" width="240" height="108" rx="8" class="box"/>
  <rect x="44" y="350" width="3" height="92" rx="1.5" fill="#ffd23f"/>
  <text x="60" y="370" class="box-title">elemctl</text>
  <text x="60" y="391" class="mono code">apps debug / apps get</text>
  <text x="60" y="413" class="box-body">читает .env в корне исходников</text>
  <text x="60" y="431" class="mono code-dim">(реквизиты ELEMENT_*, app id)</text>

  <!-- Browser -->
  <rect x="44" y="512" width="548" height="72" rx="8" class="box"/>
  <rect x="44" y="520" width="3" height="56" rx="1.5" fill="#56d364"/>
  <text x="60" y="540" class="box-title">Браузер – отлаживаемое приложение</text>
  <text x="60" y="564" class="mono code">&lt;app-uri&gt;?debug-server-host=...&amp;debug-session-id=&lt;sessionId&gt;</text>

  <!-- Debug-сервер платформы -->
  <rect x="672" y="208" width="260" height="60" rx="8" class="box"/>
  <rect x="672" y="216" width="3" height="44" rx="1.5" fill="#a78bfa"/>
  <text x="688" y="243" class="box-title">Debug-сервер платформы</text>

  <!-- Console API -->
  <rect x="672" y="356" width="260" height="72" rx="8" class="box"/>
  <rect x="672" y="364" width="3" height="56" rx="1.5" fill="#39c5cf"/>
  <text x="688" y="384" class="box-title">Console API</text>
  <text x="688" y="406" class="mono code">/actions/debug</text>
</svg>
