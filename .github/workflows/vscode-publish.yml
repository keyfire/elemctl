name: VS Code extension

# Publishing the debug companion extension (editors/vscode). Fires on vscode-vX.Y.Z tags
# (separately from elemctl releases). The version is taken from editors/vscode/package.json –
# the tag has to match it. Publishing to the marketplaces happens only when the token secrets
# are set (VSCE_PAT, OVSX_PAT); without them a GitHub Release with the .vsix is all that is left.

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Package .vsix
        run: npm run package
      - name: GitHub Release (.vsix)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/xbsl-debug.vsix
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npm run publish:vsce
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npm run publish:ovsx
