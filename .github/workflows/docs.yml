# Publishing the documentation site (blume.config.ts) to GitHub Pages. The Pages source
# in the repository settings has to be "GitHub Actions" (Settings -> Pages -> Source).
# The site lives as a separate subproject in site/ (with its own package.json): the root
# dist/ is taken by package builds, and blume builds into a dist next to its own config –
# that way they do not clash. The build is checked with the same `npx blume build` as
# locally; the output goes to site/dist/.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/docs.yml"
      # The changelog page mirrors the root CHANGELOG (see scripts/sync-docs.mjs).
      - "CHANGELOG.md"
      - "CHANGELOG.ru.md"
      - "scripts/sync-docs.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One version is published at a time; a new push does not cancel a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is needed for the "last modified" dates (lastModified in blume.config.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
        working-directory: site
      # Mirror the CHANGELOG into the site pages before building, so that the deployed
      # site always matches the current file at the repository root.
      - name: Sync mirrored docs
        run: npm run sync:docs
        working-directory: site
      - name: Build
        run: npx blume build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
