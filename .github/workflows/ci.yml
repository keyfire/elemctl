# Тесты на каждый коммит в main и на каждый pull request.
#
# Раньше набор гонялся только в публикующем workflow (по тегу v*), поэтому
# сломанный main обнаруживался в момент релиза и срывал публикацию. Здесь тот
# же прогон, но заранее и без публикации.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница requires-python и актуальная версия: набор ходит в
        # даты, пути и argparse, где различия версий как раз и всплывают.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest -q
