# The test suite on every commit to main and on every pull request.
#
# It used to run only in the publishing workflow (on a v* tag), so a broken main
# surfaced at release time and took the publication down with it. Same run, just
# earlier and without publishing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound of requires-python and a current version: the suite
        # touches dates, paths and argparse, where version differences show up.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest -q
