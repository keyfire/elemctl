# The test suite on every commit to main and on every pull request.
#
# It used to run only in the publishing workflow (on a v* tag), so a broken main
# surfaced at release time and took the publication down with it. Same run, just
# earlier and without publishing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound of requires-python and a current version: the suite
        # touches dates, paths and argparse, where version differences show up.
        python-version: ["3.10", "3.12"]
        # The MCP server works with both majors of the mcp package, but a plain
        # install always resolves to the newer one – so one job downgrades and
        # keeps the older branch of the compatibility import covered as well.
        mcp-major: ["2", "1"]
        exclude:
          - python-version: "3.10"
            mcp-major: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,mcp]"
      - if: matrix.mcp-major == '1'
        run: python -m pip install "mcp<2"
      - run: python -m pytest -q

  # The documentation guard: a tool, a variable or an extension the code has and the pages
  # do not, and the README sections that are filled from the site pages going stale. The
  # suite covers it too, but a job of its own says what broke without reading the log.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/docsguard.py
