# Publishing the package to PyPI on a v0.4.1-style tag through Trusted Publishing (OIDC):
# PyPI marks the project links as verified and attaches provenance attestations.
# Requires a one-time setup on the PyPI side: Manage project -> Publishing ->
# Add GitHub publisher (owner, repo, workflow pypi-publish.yml, environment pypi).
# This workflow does not touch the extension's vscode-v* tags.
name: pypi-publish

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
