# elemctl package metadata (section 1 of the specification).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elemctl"
dynamic = ["version"]
description = "CLI, MCP server and library for the Console API v2 of the 1C:Enterprise.Element platform (1cmycloud): applications, builds from source, one-command deploy with verification, a compile probe"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KeyFire" }]
keywords = ["1c", "element", "1cmycloud", "console-api", "deploy", "mcp", "xbsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/keyfire/elemctl"
Repository = "https://github.com/keyfire/elemctl"
Issues = "https://github.com/keyfire/elemctl/issues"
Changelog = "https://github.com/keyfire/elemctl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.2,<3"]
dev = ["pytest>=7"]

[project.scripts]
elemctl = "elemctl.cli:main"

[tool.setuptools.dynamic]
version = { attr = "elemctl.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: the tests run in a clean clone without an editable install of the package
pythonpath = ["src"]
