# Метаданные пакета elemctl (раздел 1 спецификации).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elemctl"
version = "0.7.0"
description = "CLI, MCP-сервер и библиотека для Console API v2 платформы 1С:Предприятие.Элемент (1cmycloud)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KeyFire" }]
keywords = ["1c", "element", "1cmycloud", "console-api", "deploy", "mcp", "xbsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/keyfire/elemctl"
Repository = "https://github.com/keyfire/elemctl"
Issues = "https://github.com/keyfire/elemctl/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
elemctl = "elemctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
